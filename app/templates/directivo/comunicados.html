{% extends "base.html" %}
{% block page_title %}Comunicados masivos{% endblock %}
{% set active = 'comunicados' %}
{% block content %}
<div class="card">
  <form method="post" action="/directivo/comunicados/enviar">
    <label>Título</label>
    <input type="text" name="titulo" required>
    <label>Contenido</label>
    <textarea name="contenido" required></textarea>
    <label>Curso (vacío = toda la institución)</label>
    <select name="curso_id">
      <option value="">— Todos —</option>
      {% for c in cursos %}<option value="{{ c.id }}">{{ c.nombre_completo }}</option>{% endfor %}
    </select>
    <label><input type="checkbox" name="requiere_firma" value="true"> Requiere firma familiar</label>
    <button type="submit" class="btn">Enviar comunicado</button>
  </form>
</div>
<div class="card">
  <h2>Enviados recientemente</h2>
  {% for c in comunicados_enviados %}
  <p>{{ c.titulo }} — {{ c.fecha_envio | fmt_fecha }}</p>
  {% endfor %}
</div>
{% endblock %}

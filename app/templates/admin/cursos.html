{% extends "base.html" %}
{% block page_title %}Cursos{% endblock %}
{% set active = 'cursos' %}
{% block content %}
<div class="card">
  <form method="post" action="/admin/cursos/nuevo">
    <label>Año lectivo</label>
    <input type="text" name="anio" value="2026" required>
    <label>Nivel</label>
    <select name="nivel">{% for n in niveles %}<option value="{{ n }}">{{ n }}</option>{% endfor %}</select>
    <label>División</label>
    <input type="text" name="division" placeholder="4to A" required>
    <label>Turno</label>
    <select name="turno">{% for t in turnos %}<option value="{{ t }}">{{ t }}</option>{% endfor %}</select>
    <button type="submit" class="btn">Crear curso</button>
  </form>
</div>
<table class="card">
  <tr><th>División</th><th>Nivel</th><th>Turno</th><th>Año</th></tr>
  {% for c in cursos %}
  <tr><td>{{ c.division }}</td><td>{{ c.nivel.value }}</td><td>{{ c.turno.value }}</td><td>{{ c.anio }}</td></tr>
  {% endfor %}
</table>
{% endblock %}

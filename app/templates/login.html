<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar — EscudoEscolar</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>🛡️ {{ app_name }}</h1>
    <p style="text-align:center;color:#6b7280;margin-bottom:1.5rem;">
      Acompañamiento y bienestar escolar
    </p>
    {% if error %}<div class="alert alert-error">{{ error | replace('+', ' ') }}</div>{% endif %}
    {% if success %}<div class="alert alert-success">{{ success | replace('+', ' ') }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <p style="margin-top:1.25rem">
        <button type="submit" class="btn" style="width:100%">Ingresar</button>
      </p>
    </form>
    <p style="font-size:0.8rem;color:#9ca3af;margin-top:1.5rem;text-align:center">
      Demo: ver README con usuarios de prueba
    </p>
  </div>
</body>
</html>

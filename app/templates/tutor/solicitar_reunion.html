{% extends "base.html" %}
{% block page_title %}Solicitar reunión{% endblock %}
{% set active = 'reunion' %}
{% block content %}
<div class="card">
  <form method="post" action="/tutor/solicitar-reunion">
    <label>Docente</label>
    <select name="docente_id" required>
      {% for d in docentes %}<option value="{{ d.id }}">{{ d.nombre }}</option>{% endfor %}
    </select>
    <label>Fecha propuesta</label>
    <input type="date" name="fecha_propuesta" required>
    <label>Modalidad</label>
    <select name="modalidad">
      <option value="presencial">Presencial</option>
      <option value="virtual">Virtual</option>
    </select>
    <label>Motivo</label>
    <textarea name="motivo" required></textarea>
    <p style="margin-top:1rem"><button type="submit" class="btn">Enviar solicitud</button></p>
  </form>
</div>
{% endblock %}
